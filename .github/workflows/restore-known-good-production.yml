name: Restore known-good production

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Check out production branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0

      - name: Restore production-stable snapshot
        shell: bash
        run: |
          git fetch origin production-stable
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git read-tree --reset -u origin/production-stable
          if git diff --cached --quiet; then
            echo "Production already matches production-stable."
            exit 0
          fi
          git commit -m "fix: restore known-good production"
          git push origin HEAD:gh-pages
